<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Admin · CampusFind</title><link rel="stylesheet" href="/css/app.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="page"><div class="welcome"><div><div class="eyebrow">ADMIN CONTROL CENTER</div><h1>Campus operations</h1><p>Review reports, workflows and audit history.</p></div></div><section><div class="sectionhead"><h2>All reports</h2><span class="tag" th:text="${items.size()+' total'}"></span></div><div class="tablewrap"><table><tr><th>ID</th><th>Item</th><th>Type</th><th>Student</th><th>Submitted</th><th>Status</th><th></th></tr><tr th:each="i:${items}"><td th:text="${i.id}"></td><td><a th:href="@{'/item/'+${i.id}}" th:text="${i.itemName}"></a></td><td th:text="${i.reportType}"></td><td th:text="${i.reporter.name}"></td><td th:text="${i.submittedAt}"></td><td th:text="${i.status}"></td><td><a th:href="@{'/item/'+${i.id}}">Review</a></td></tr></table></div></section><section><div class="sectionhead"><h2>Deletion requests</h2></div><div class="tablewrap"><table><tr><th>Item</th><th>Requester</th><th>Reason</th><th>Decision</th><th></th></tr><tr th:each="d:${deletions}"><td th:text="${d.item.itemName}"></td><td th:text="${d.requester.name}"></td><td th:text="${d.reason}"></td><td th:text="${d.decision}"></td><td th:if="${d.decision=='PENDING'}"><form method="post" th:action="@{'/admin/deletion/'+${d.id}}" class="inline"><button name="decision" value="APPROVED" class="smallbtn">Approve</button><button name="decision" value="REJECTED" class="smallbtn danger">Reject</button></form></td></tr></table></div></section><section><div class="sectionhead"><h2>Handover records</h2></div><div class="tablewrap"><table><tr><th>Item</th><th>Requester</th><th>Recipient</th><th>Meeting</th><th>Confirmed</th><th></th></tr><tr th:each="h:${handovers}"><td th:text="${h.item.itemName}"></td><td th:text="${h.requester.name}"></td><td th:text="${h.recipient.name}"></td><td th:text="${h.location+' · '+h.scheduledAt}"></td><td th:text="${h.bothConfirmed}"></td><td><form method="post" th:action="@{'/admin/handover/'+${h.id}+'/close'}"><button class="smallbtn" th:if="${h.bothConfirmed and !h.adminClosed}">Close</button></form></td></tr></table></div></section><section><div class="sectionhead"><h2>Audit log</h2></div><div class="tablewrap"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr><tr th:each="l:${logs}"><td th:text="${l.at}"></td><td th:text="${l.actor != null ? l.actor.username : 'system'}"></td><td th:text="${l.action}"></td><td th:text="${l.details}"></td></tr></table></div></section></main></body></html>
