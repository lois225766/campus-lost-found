<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Dashboard · CampusFind</title><link rel="stylesheet" href="/css/app.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="page"><div class="welcome"><div><div class="eyebrow">STUDENT DASHBOARD</div><h1>Hi, <span th:text="${user.name}">Student</span>.</h1><p th:text="${user.semester}">S4 CSE</p></div><a class="btn primary" href="/report">+ Report item</a></div><div th:if="${param.success}" class="alert success" th:text="${param.success}"></div><section class="metricrow"><div class="metric"><b th:text="${myItems.size()}">0</b><span>Your reports</span></div><div class="metric"><b th:text="${matchesCount}">0</b><span>Possible matches</span></div><div class="metric"><b th:text="${handovers.size()}">0</b><span>Handover records</span></div><div class="metric"><b th:text="${deletions.size()}">0</b><span>Deletion requests</span></div></section><section><div class="sectionhead"><h2>Browse campus reports</h2></div><form class="filters" method="get"><input name="q" th:value="${q}" placeholder="Search item or location..."><select name="type"><option value="">All types</option><option value="LOST" th:selected="${type=='LOST'}">Lost</option><option value="FOUND" th:selected="${type=='FOUND'}">Found</option></select><select name="category"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c}" th:selected="${category==c.name()}" th:text="${c}"></option></select><select name="status"><option value="">All statuses</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select><button class="btn dark">Filter</button></form><div class="cards"><article class="itemcard" th:each="i:${items}"><div class="photo" th:if="${i.photoPath}"><img th:src="${i.photoPath}"></div><div class="cardbody"><div class="badges"><span class="badge" th:classappend="${i.reportType=='LOST'}?' lost':' found'" th:text="${i.reportType}"></span><span class="badge neutral" th:text="${i.status}"></span></div><h3 th:text="${i.itemName}"></h3><p th:text="${i.category+' · '+i.location}"></p><small th:text="${i.eventDate}"></small><a class="cardlink" th:href="@{'/item/'+${i.id}}">View details →</a></div></article></div></section><section><div class="sectionhead"><h2>Your reports</h2></div><div class="tablewrap"><table><tr><th>Item</th><th>Type</th><th>Status</th><th>Matches</th><th></th></tr><tr th:each="i:${myItems}"><td th:text="${i.itemName}"></td><td th:text="${i.reportType}"></td><td th:text="${i.status}"></td><td><a th:href="@{'/item/'+${i.id}}" class="tag">View</a></td><td><a th:href="@{'/item/'+${i.id}}">Manage</a></td></tr></table></div></section><section><div class="sectionhead"><h2>Handover requests</h2></div><div class="tablewrap" th:if="${!handovers.empty}"><table><tr><th>Item</th><th>When</th><th>Location</th><th>Status</th><th></th></tr><tr th:each="h:${handovers}"><td th:text="${h.item.itemName}"></td><td th:text="${h.scheduledAt}"></td><td th:text="${h.location}"></td><td th:text="${h.bothConfirmed?'Both confirmed':'Awaiting confirmation'}"></td><td><form method="post" th:action="@{'/handover/'+${h.id}+'/confirm'}"><button class="smallbtn" th:if="${(h.requester.id==user.id and !h.requesterConfirmed) or (h.recipient.id==user.id and !h.recipientConfirmed)}">Confirm</button></form></td></tr></table></div><div class="empty" th:if="${handovers.empty}">No handover requests yet.</div></section></main></body></html>
