<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Report · CampusFind</title><link rel="stylesheet" href="/css/app.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="page"><div class="pagehead"><div><div class="eyebrow">CONTRIBUTE TO CAMPUS</div><h1>Report an item</h1><p>Choose Lost or Found and give enough detail for the right person to verify it privately.</p></div></div><div th:if="${error}" class="alert error" th:text="${error}"></div><form class="form-card" action="/report" method="post" enctype="multipart/form-data"><div class="toggle"><label><input type="radio" name="type" value="LOST" checked> I lost something</label><label><input type="radio" name="type" value="FOUND"> I found something</label></div><div class="grid2"><label>Item name<input name="itemName" placeholder="e.g. Black Bluetooth headphones" required></label><label>Category<select name="category" required><option th:each="c:${categories}" th:value="${c}" th:text="${c}"></option></select></label><label>Date lost/found<input type="date" name="eventDate" required></label><label>Location<input name="location" placeholder="e.g. Main Library" required></label><label class="fullrow">Photo (optional)<input type="file" name="photo" accept="image/*"></label><label class="fullrow">Private identifying description<textarea name="privateDescription" rows="5" placeholder="Details only the true owner should know..." required></textarea><small class="hint">This is never shown on public listings.</small></label></div><button class="btn primary">Submit report</button></form></main></body></html>
